apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-watcher
  namespace: observability
---
# read only, and no access to secrets or configmaps
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-k8s-watcher
rules:
  - apiGroups: [""]
    resources: [pods, events, nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-k8s-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observability-k8s-watcher
subjects:
  - kind: ServiceAccount
    name: k8s-watcher
    namespace: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-watcher
  namespace: observability
spec:
  replicas: 1
  # two watchers would send every alert twice, so the old pod stops before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: k8s-watcher
  template:
    metadata:
      labels:
        app: k8s-watcher
    spec:
      serviceAccountName: k8s-watcher
      containers:
        - name: k8s-watcher
          image: ghcr.io/pbonard/k8s-watcher:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          envFrom:
            # DISCORD_WEBHOOK_URL, where alerts are sent, without it they are only logged
            - secretRef:
                name: k8s-watcher-notify
                optional: true
