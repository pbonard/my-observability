name: k8s-watcher
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/k8s-watcher.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout github
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: build and push k8s-watcher
        env:
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/k8s-watcher
        run: |
          IMAGE=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          docker buildx build --platform linux/amd64 \
            -t "$IMAGE:${GITHUB_SHA::7}" \
            -t "$IMAGE:latest" \
            -f ./Dockerfile . --push
